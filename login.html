<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · FocusFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#080a10;
    --bg-1:#0d111a;
    --surface:rgba(20,25,36,0.62);
    --surface-border:rgba(255,255,255,0.08);
    --text-hi:#e9ecf4;
    --text-lo:#8b93a7;
    --accent:#6c8cff;     /* binaural blue */
    --accent-2:#49dfd0;   /* healing-frequency teal */
    --danger:#ff8a8a;
    --ok:#7be0c4;
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Manrope',sans-serif;
    background:radial-gradient(circle at 20% 15%, #121a2c 0%, var(--bg-0) 55%, #05060a 100%);
    color:var(--text-hi);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding:24px;
  }

  /* ---- ambient waveform signature ---- */
  .wave-field{
    position:fixed;
    inset:0;
    z-index:0;
    opacity:0.55;
    pointer-events:none;
  }
  .wave-field svg{width:100%;height:100%;}
  .wave-line{
    fill:none;
    stroke-width:1.4;
    opacity:0.5;
  }
  .wave-line.w1{stroke:var(--accent);}
  .wave-line.w2{stroke:var(--accent-2);}
  .wave-line.w3{stroke:#39406b;}

  @keyframes drift{
    0%{ transform:translateX(0) translateY(0); }
    50%{ transform:translateX(-2%) translateY(6px); }
    100%{ transform:translateX(0) translateY(0); }
  }
  .wave-line.w1{ animation:drift 9s ease-in-out infinite; }
  .wave-line.w2{ animation:drift 13s ease-in-out infinite reverse; }
  .wave-line.w3{ animation:drift 17s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    .wave-line{ animation:none !important; }
  }

  /* ---- card ---- */
  .panel{
    position:relative;
    z-index:1;
    width:100%;
    max-width:392px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    border-radius:var(--radius);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:38px 34px 30px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:26px;
  }
  .brand .mark{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .brand span{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.3px;
    color:var(--text-hi);
  }

  h1{
    font-family:'Newsreader',serif;
    font-style:italic;
    font-weight:500;
    font-size:28px;
    line-height:1.25;
    margin:0 0 6px;
  }
  .sub{
    color:var(--text-lo);
    font-size:13.5px;
    margin:0 0 26px;
    line-height:1.5;
  }

  .tabs{
    display:flex;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--surface-border);
    border-radius:12px;
    padding:4px;
    margin-bottom:24px;
  }
  .tabs button{
    flex:1;
    border:none;
    background:transparent;
    color:var(--text-lo);
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:9px 0;
    border-radius:9px;
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .tabs button.active{
    background:rgba(255,255,255,0.08);
    color:var(--text-hi);
  }

  form{display:flex; flex-direction:column; gap:14px;}
  label{
    font-size:12px;
    color:var(--text-lo);
    margin-bottom:6px;
    display:block;
    font-weight:600;
    letter-spacing:0.2px;
  }
  .field input{
    width:100%;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--surface-border);
    color:var(--text-hi);
    border-radius:11px;
    padding:11px 13px;
    font-size:14px;
    font-family:'Manrope',sans-serif;
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .field input::placeholder{ color:#5d6478; }
  .field input:focus{
    border-color:var(--accent);
    background:rgba(108,140,255,0.07);
  }
  .field input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .row-between{
    display:flex;
    justify-content:flex-end;
    margin-top:-4px;
  }
  .link-muted{
    font-size:12px;
    color:var(--accent-2);
    text-decoration:none;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Manrope',sans-serif;
    padding:0;
  }
  .link-muted:hover{ text-decoration:underline; }

  .btn-primary{
    margin-top:6px;
    border:none;
    border-radius:11px;
    padding:12px 0;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14px;
    color:#06080f;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    cursor:pointer;
    transition:filter .2s, transform .15s;
  }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:disabled{ opacity:0.55; cursor:not-allowed; }
  .btn-primary:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 14px;
    color:var(--text-lo);
    font-size:11.5px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--surface-border);
  }

  .btn-google{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    border:1px solid var(--surface-border);
    background:rgba(255,255,255,0.04);
    color:var(--text-hi);
    border-radius:11px;
    padding:11px 0;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:background .2s;
  }
  .btn-google:hover{ background:rgba(255,255,255,0.08); }
  .btn-google svg{ width:16px; height:16px; }

  .msg{
    font-size:12.5px;
    border-radius:9px;
    padding:9px 11px;
    margin-top:4px;
    display:none;
    line-height:1.4;
  }
  .msg.show{ display:block; }
  .msg.err{ background:rgba(255,138,138,0.1); color:var(--danger); border:1px solid rgba(255,138,138,0.25); }
  .msg.ok{ background:rgba(123,224,196,0.1); color:var(--ok); border:1px solid rgba(123,224,196,0.25); }

  .back{
    display:block;
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:var(--text-lo);
    text-decoration:none;
  }
  .back:hover{ color:var(--text-hi); }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="wave-field" aria-hidden="true">
  <svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
    <path class="wave-line w1" d="M -50 220 Q 100 150, 250 220 T 550 220 T 850 220" />
    <path class="wave-line w2" d="M -50 380 Q 150 460, 300 380 T 600 380 T 900 380" />
    <path class="wave-line w3" d="M -50 480 Q 200 420, 400 480 T 800 480 T 1100 480" />
  </svg>
</div>

<main class="panel">
  <div class="brand">
    <div class="mark">🎧</div>
    <span>FocusFlow</span>
  </div>

  <h1 id="heading">Find your flow.</h1>
  <p class="sub" id="subcopy">Sign in to keep your presets and progress with you, wherever you listen.</p>

  <div class="tabs" role="tablist" aria-label="Choose sign in or create account">
    <button id="tab-signin" class="active" role="tab" aria-selected="true">Sign in</button>
    <button id="tab-signup" role="tab" aria-selected="false">Create account</button>
  </div>

  <div id="msg-box" class="msg" role="alert"></div>

  <form id="auth-form">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="At least 6 characters" autocomplete="current-password" required minlength="6" />
    </div>
    <div class="row-between">
      <button type="button" id="forgot-link" class="link-muted">Forgot password?</button>
    </div>
    <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
  </form>

  <div class="divider">OR</div>

  <button type="button" class="btn-google" id="google-btn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.3 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.3 29.6 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5C29.6 34.7 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.5C41.5 36 44 30.6 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Continue with Google
  </button>

  <a href="index.html" class="back">← Back to FocusFlow</a>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    sendPasswordResetEmail,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  /* ===================================================================
     TODO — paste your own Firebase config here.
     Get this from: Firebase Console → Project settings → General →
     "Your apps" → Web app → SDK setup and configuration.
     =================================================================== */
  const firebaseConfig = {
    apiKey: "AIzaSyBRU-dgYjWXuBdOF85hLUs3_H-2G3PHMqg",
    authDomain: "focus-flow-a5549.firebaseapp.com",
    projectId: "focus-flow-a5549",
    storageBucket: "focus-flow-a5549.firebasestorage.app",
    messagingSenderId: "816968112197",
    appId: "1:816968112197:web:07aa3556f8e73f63ceeb2c"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ---- elements ----
  const form        = document.getElementById('auth-form');
  const emailInput  = document.getElementById('email');
  const passInput   = document.getElementById('password');
  const submitBtn   = document.getElementById('submit-btn');
  const googleBtn   = document.getElementById('google-btn');
  const forgotLink  = document.getElementById('forgot-link');
  const msgBox      = document.getElementById('msg-box');
  const tabSignin   = document.getElementById('tab-signin');
  const tabSignup   = document.getElementById('tab-signup');
  const heading     = document.getElementById('heading');
  const subcopy     = document.getElementById('subcopy');

  let mode = 'signin'; // or 'signup'

  function setMode(next){
    mode = next;
    const isSignin = mode === 'signin';
    tabSignin.classList.toggle('active', isSignin);
    tabSignup.classList.toggle('active', !isSignin);
    tabSignin.setAttribute('aria-selected', isSignin);
    tabSignup.setAttribute('aria-selected', !isSignin);
    submitBtn.textContent = isSignin ? 'Sign in' : 'Create account';
    heading.textContent = isSignin ? 'Find your flow.' : 'Begin your flow.';
    subcopy.textContent = isSignin
      ? 'Sign in to keep your presets and progress with you, wherever you listen.'
      : 'Create an account to save presets and pick up where you left off.';
    passInput.setAttribute('autocomplete', isSignin ? 'current-password' : 'new-password');
    hideMsg();
  }
  tabSignin.addEventListener('click', () => setMode('signin'));
  tabSignup.addEventListener('click', () => setMode('signup'));

  function showMsg(text, type){
    msgBox.textContent = text;
    msgBox.className = 'msg show ' + type;
  }
  function hideMsg(){
    msgBox.className = 'msg';
  }

  function friendlyError(code){
    const map = {
      'auth/invalid-email': 'That email address looks invalid.',
      'auth/user-not-found': 'No account found with that email.',
      'auth/wrong-password': 'Incorrect password. Try again.',
      'auth/invalid-credential': 'Incorrect email or password.',
      'auth/email-already-in-use': 'An account already exists with that email — try signing in instead.',
      'auth/weak-password': 'Password should be at least 6 characters.',
      'auth/too-many-requests': 'Too many attempts. Please wait a moment and try again.',
      'auth/popup-closed-by-user': 'Google sign-in was closed before finishing.'
    };
    return map[code] || 'Something went wrong. Please try again.';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMsg();
    submitBtn.disabled = true;
    const email = emailInput.value.trim();
    const password = passInput.value;

    try{
      if(mode === 'signin'){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
      showMsg('Success — redirecting…', 'ok');
      window.location.href = 'index.html';
    } catch(err){
      showMsg(friendlyError(err.code), 'err');
    } finally {
      submitBtn.disabled = false;
    }
  });

  googleBtn.addEventListener('click', async () => {
    hideMsg();
    try{
      const provider = new GoogleAuthProvider();
      await signInWithPopup(auth, provider);
      showMsg('Success — redirecting…', 'ok');
      window.location.href = 'index.html';
    } catch(err){
      showMsg(friendlyError(err.code), 'err');
    }
  });

  forgotLink.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if(!email){
      showMsg('Enter your email above first, then tap "Forgot password?".', 'err');
      return;
    }
    try{
      await sendPasswordResetEmail(auth, email);
      showMsg('Password reset email sent — check your inbox.', 'ok');
    } catch(err){
      showMsg(friendlyError(err.code), 'err');
    }
  });

  // If already signed in, skip straight to the app.
  onAuthStateChanged(auth, (user) => {
    if(user){
      window.location.href = 'index.html';
    }
  });
</script>
</body>
</html>
